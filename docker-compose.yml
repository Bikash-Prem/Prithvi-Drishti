# Prithvi Drishti — one-command local/dev run. `docker compose up`.
# Backend boots with NO keys (deterministic mock fallbacks); set keys in .env to
# activate the LLM and live connectors. Build the ML variant with:
#   docker compose build --build-arg INCLUDE_ML=true backend
services:
  backend:
    build:
      context: ./backend
      args:
        INCLUDE_ML: "false"
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Allow the vite dev server origin through CORS.
      FRONTEND_ORIGIN: "http://localhost:5173"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend

  # Optional data stores: `docker compose --profile data up`. Set the passwords in
  # .env first (see .env.example), then POSTGIS_ENABLED / NEO4J_ENABLED for the backend.
  postgis:
    profiles: ["data"]
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: prithvidrishti
      POSTGRES_USER: prithvidrishti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/migrations/001_postgis.sql:/docker-entrypoint-initdb.d/001_postgis.sql:ro

  neo4j:
    profiles: ["data"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgis_data:
  neo4j_data:
